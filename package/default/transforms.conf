# KV store collections as lookups (Search: | inputlookup <stanza_name>)

[stig_collections]
external_type = kvstore
collection = stig_collections
fields_list = _key, name, description, is_default, metadata, created_at, updated_at

[stig_baselines]
external_type = kvstore
collection = stig_baselines
fields_list = _key, stig_id, title, version, rule_count, content_fingerprint, source_uri, imported_at

[stig_reviews]
external_type = kvstore
collection = stig_reviews
fields_list = _key, checklist_id, baseline_id, group_id, rule_id, rule_version, check_content_hash, status, finding_details, comments, valid, package_id, ingest_lock, updated_at, updated_by

[stig_review_history]
external_type = kvstore
collection = stig_review_history
fields_list = _key, review_id, stig_collection_id, checklist_id, host_id, baseline_id, rule_id, action, summary, actor, created_at, previous_status, new_status, previous_workflow_state, new_workflow_state

[stig_checklists]
external_type = kvstore
collection = stig_checklists
fields_list = _key, stig_collection_id, host_id, baseline_id, title, mode, target_data, created_at, updated_at, created_by, updated_by

[stig_baseline_rules]
external_type = kvstore
collection = stig_baseline_rules
fields_list = _key, baseline_id, group_id, rule_id, rule_id_src, rule_version, severity, rule_title, group_title, check_content_hash
