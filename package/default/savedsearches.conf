[STIG reconcile findings to KV]
description = Apply the latest indexed stig:finding events to KV current state. Incoming findings overwrite matching reviews unless ingest_lock is true.
cron_schedule = */5 * * * *
enableSched = 1
schedule_window = auto
dispatch.earliest_time = -15m
dispatch.latest_time = now
search = | stigkvreconcile
request.ui_dispatch_app = stigs_in_splunk
is_visible = 1

[STIG review aging report]
description = List reviews stale under each grant-visible workspace review_aging policy (report-only; uses search runner ACL). Enable workspace aging and schedule alerting as needed.
cron_schedule = 0 6 * * *
enableSched = 0
schedule_window = auto
dispatch.earliest_time = -1h
dispatch.latest_time = now
search = | stigkvreviewaging
request.ui_dispatch_app = stigs_in_splunk
is_visible = 1
