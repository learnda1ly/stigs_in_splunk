# Splunk restmap.conf allows only one `match` per stanza; duplicate keys overwrite.
# Persist /stig_* handlers live here. UCC Configuration admin_external stanzas are
# generated at build time and merged in. additional_packaging.py restores them if
# this file is copied over the built restmap.conf.

[script:stig_api_collections]
match = /stig_collections
script = stig_rest_handler.py
scripttype = persist
handler = stig_rest_handler.StigRestHandler
python.version = python3
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = true
methods = GET,POST,PATCH,PUT,DELETE
capability.stig_read = GET
capability.stig_write = POST|PATCH|PUT
capability.stig_admin = DELETE

