# UCC Configuration table used to POST zips to admin_external (EAI XML). That
# path cannot carry a library zip. This persist endpoint keeps list/delete and
# rejects create-with-file as JSON instead of wrapping the zip in XML.
[script:stig_ucc_baseline]
match = /stigs_in_splunk_baseline
script = stig_rest_handler.py
scripttype = persist
handler = stig_rest_handler.StigRestHandler
python.version = python3
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = true
scripttimeout = 600
methods = GET,POST,PATCH,PUT,DELETE
capability.stig_read = GET
capability.stig_write = POST|PATCH|PUT
capability.stig_admin = DELETE

# UCC Configuration (Workspaces + Editor & ingest). Required for the
# configuration view; without these stanzas Splunk Web returns "Not Found".
[admin:stigs_in_splunk]
match = /
members = stigs_in_splunk_settings, stigs_in_splunk_workspace

[admin_external:stigs_in_splunk_workspace]
handlertype = python
python.version = python3
handlerfile = stigs_in_splunk_rh_workspace.py
handleractions = edit, list, remove, create
handlerpersistentmode = true

[admin_external:stigs_in_splunk_settings]
handlertype = python
python.version = python3
handlerfile = stigs_in_splunk_rh_settings.py
handleractions = edit, list
handlerpersistentmode = true
