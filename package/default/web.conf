# Expose persistconn REST to Splunk Web / management port.
# Use globs (not regex). Nested /** is required for sub-paths (export, import, rules).

[expose:stig_collections]
pattern = stig_collections
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_collections_nested]
pattern = stig_collections/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_hosts]
pattern = stig_hosts
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_hosts_nested]
pattern = stig_hosts/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_baselines]
pattern = stig_baselines
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_baselines_nested]
pattern = stig_baselines/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_checklists]
pattern = stig_checklists
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_checklists_nested]
pattern = stig_checklists/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_reviews]
pattern = stig_reviews
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_reviews_nested]
pattern = stig_reviews/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_findings]
pattern = stig_findings
methods = GET

[expose:stig_findings_nested]
pattern = stig_findings/**
methods = GET

[expose:stig_imports]
pattern = stig_imports
methods = GET,POST

[expose:stig_imports_nested]
pattern = stig_imports/**
methods = GET,POST

[expose:stig_settings]
pattern = stig_settings
methods = GET,POST,PATCH,PUT

# UCC Configuration (Splunk Web only proxies exposed admin_external endpoints).
[expose:stigs_in_splunk_workspace]
pattern = stigs_in_splunk_workspace
methods = GET, POST

[expose:stigs_in_splunk_workspace_specified]
pattern = stigs_in_splunk_workspace/*
methods = GET, POST, DELETE

[expose:stigs_in_splunk_settings]
pattern = stigs_in_splunk_settings
methods = GET, POST

[expose:stigs_in_splunk_settings_specified]
pattern = stigs_in_splunk_settings/*
methods = GET, POST, DELETE
