# Expose persistconn REST to Splunk Web / management port.
# Use globs (not regex). Nested /** is required for sub-paths (export, import, rules).

[expose:stig_collections]
pattern = stig_collections
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_collections_nested]
pattern = stig_collections/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_hosts]
pattern = stig_hosts
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_hosts_nested]
pattern = stig_hosts/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_baselines]
pattern = stig_baselines
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_baselines_nested]
pattern = stig_baselines/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_checklists]
pattern = stig_checklists
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_checklists_nested]
pattern = stig_checklists/**
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_reviews]
pattern = stig_reviews
methods = GET,POST,PATCH,PUT,DELETE

[expose:stig_reviews_nested]
pattern = stig_reviews/**
methods = GET,POST,PATCH,PUT,DELETE
