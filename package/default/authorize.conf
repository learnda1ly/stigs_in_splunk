[capabilities]
stig_read = View STIG collections, hosts, baselines, checklists, and reviews via the app REST API.
stig_write = Create and update STIG data via the app REST API.
stig_review_accept = Accept or reject submitted STIG reviews (owner/manager governance).
stig_admin = Manage stig_collection access lists and delete STIG entities.

[role_stig_user]
stig_read = enabled
stig_write = enabled
srchIndexesAllowed = stig
srchIndexesDefault = stig

[role_stig_admin]
imported_roles = stig_user
stig_review_accept = enabled
stig_admin = enabled
srchIndexesAllowed = stig;*

[role_admin]
stig_read = enabled
stig_write = enabled
stig_review_accept = enabled
stig_admin = enabled
