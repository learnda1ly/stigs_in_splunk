# Splunk Web development overrides (install only on dev instances).
#
# Official references:
# - web.conf [settings]: js_no_cache, cacheEntriesLimit, cacheBytesLimit
#   https://help.splunk.com/en/splunk-enterprise/administer/admin-manual/10.4/configuration-file-reference/10.4.1-configuration-file-reference/web.conf
# - Customize Splunk Web — clear server asset cache (cacheEntriesLimit=0 for dev)
#   https://help.splunk.com/en/splunk-cloud-platform/developing-views-and-apps-for-splunk-web/10.5.2605/customize-splunk-web/customization-options-and-caching
# - Asset caching (client + server)
#   https://dev.splunk.com/enterprise/docs/developapps/manageknowledge/assetcaching/
#
# After changing this app, restart splunkd (or at least splunkweb) and hard-refresh
# the browser. Bump/refresh alone may not be enough once server-side cache is off.

[settings]
js_no_cache = true
cacheEntriesLimit = 0
cacheBytesLimit = 0
