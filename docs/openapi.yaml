components:
  requestBodies:
    GrantAclBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              host_ids:
                type: array
                items:
                  type: string
              baseline_ids:
                type: array
                items:
                  type: string
              label_ids:
                type: array
                items:
                  type: string
    SettingsBody:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  securitySchemes:
    splunkBasicAuth:
      type: http
      scheme: basic
      description: Splunk management port (`curl -u user:pass`)
    splunkSessionCookie:
      type: apiKey
      in: cookie
      name: splunkd_8089
      description: Splunk Web session; include `X-Splunk-Form-Key` on mutating requests

  parameters:
    collectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
      description: Workspace KV `_key`
    hostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
    baselineId:
      name: baselineId
      in: path
      required: true
      schema:
        type: string
    checklistId:
      name: checklistId
      in: path
      required: true
      schema:
        type: string
    reviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
    grantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    paginationOffset:
      name: offset
      in: query
      schema:
        type: integer
    paginationLimit:
      name: limit
      in: query
      schema:
        type: integer

  responses:
    NotFound:
      description: Not found (or hidden by ACL)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    CascadeRequiredError:
      type: object
      properties:
        error:
          type: string
        cascade_required:
          type: boolean
        children:
          type: object

    MetadataDocument:
      type: object
      additionalProperties: true

    MetadataPatch:
      type: object
      description: Merge/replace/clear per service implementation (see spec.md)
      additionalProperties: true

    Collection:
      type: object
      properties:
        _key:
          type: string
        name:
          type: string
        description:
          type: string
        metadata:
          type: object
        default_baseline_map:
          type: object
      additionalProperties: true

    CollectionCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    CollectionUpdate:
      type: object
      additionalProperties: true

    CollectionCloneRequest:
      type: object
      properties:
        name:
          type: string
        copy_hosts:
          type: boolean
        copy_checklists:
          type: boolean
        copy_reviews:
          type: boolean
        copy_grants:
          type: boolean
        copy_labels:
          type: boolean
        copy_metadata:
          type: boolean
        copy_baseline_defaults:
          type: boolean
        copy_review_requirements:
          type: boolean

    CollectionImportBatch:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              source_uri:
                type: string
              format:
                type: string
              content:
                type: string
                description: File body (CKL/CKLB text)

    Host:
      type: object
      properties:
        _key:
          type: string
        hostname:
          type: string
        stig_collection_id:
          type: string
        label_ids:
          type: array
          items:
            type: string
        metadata:
          type: object
      additionalProperties: true

    HostCreate:
      type: object
      required: [hostname, stig_collection_id]
      properties:
        hostname:
          type: string
        stig_collection_id:
          type: string

    HostUpdate:
      type: object
      additionalProperties: true

    Baseline:
      type: object
      properties:
        _key:
          type: string
        stig_id:
          type: string
        title:
          type: string
        version:
          type: string
        release_info:
          type: string
        rule_count:
          type: integer
        content_fingerprint:
          type: string
      additionalProperties: true

    BaselineImportResult:
      type: object
      properties:
        imported:
          type: integer
        created:
          type: integer
        deduplicated:
          type: integer
        baselines:
          type: array
          items:
            $ref: "#/components/schemas/Baseline"

    OrphanBaselineRulesGcResult:
      type: object
      required: [dry_run, orphan_count, orphans, deleted_count, skipped_no_key_count]
      properties:
        dry_run:
          type: boolean
        orphan_count:
          type: integer
        deleted_count:
          type: integer
        skipped_no_key_count:
          type: integer
          description: Orphans lacking KV `_key`; reported on dry-run and execute, not deleted
        orphans:
          type: array
          items:
            type: object
            properties:
              _key:
                type: string
              baseline_id:
                type: string
              rule_id:
                type: string
              group_id:
                type: string

    BaselineJobChunk:
      type: object
      required: [action, offset, data]
      properties:
        action:
          type: string
          enum: [chunk]
        offset:
          type: integer
        data:
          type: string
          description: Base64-encoded zip bytes

    BaselineJobFinalize:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [finalize]

    BaselineJobImportMember:
      type: object
      required: [action, path]
      properties:
        action:
          type: string
          enum: [import]
        path:
          type: string
          description: Member path inside uploaded zip

    Checklist:
      type: object
      properties:
        _key:
          type: string
        stig_host_id:
          type: string
        baseline_id:
          type: string
        stig_collection_id:
          type: string
      additionalProperties: true

    Review:
      type: object
      properties:
        _key:
          type: string
        checklist_id:
          type: string
        rule_id:
          type: string
        status:
          type: string
        workflow_state:
          type: string
        ingest_lock:
          type: boolean
      additionalProperties: true

    ReviewHistoryEntry:
      type: object
      properties:
        _key:
          type: string
        review_id:
          type: string
        stig_collection_id:
          type: string
        checklist_id:
          type: string
        host_id:
          type: string
        baseline_id:
          type: string
        rule_id:
          type: string
        rule_version:
          type: string
        action:
          type: string
          description: update | submit | accept | reject | ingest | upgrade
        previous_status:
          type: string
        new_status:
          type: string
        previous_workflow_state:
          type: string
        new_workflow_state:
          type: string
        changed_fields:
          type: array
          items:
            type: string
        summary:
          type: string
        actor:
          type: string
        created_at:
          type: number
      additionalProperties: true

    ReviewHistoryListResponse:
      type: object
      properties:
        stig_collection_id:
          type: string
        stig_collection_name:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReviewHistoryEntry"
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            has_more:
              type: boolean
        filters:
          type: object
      additionalProperties: true

    ReviewHistoryByReviewResponse:
      type: object
      properties:
        review_id:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReviewHistoryEntry"
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
            has_more:
              type: boolean
      additionalProperties: true

    ReviewBatchRequest:
      type: object
      properties:
        action:
          type: string
          enum: [submit, accept, reject]
        review_ids:
          type: array
          items:
            type: string
        reject_feedback:
          type: string
        reviews:
          type: array
          items:
            type: object
        updates:
          type: array
          items:
            type: object

    ImportBatchResult:
      type: object
      description: Batch or zip import summary from imports services
      properties:
        summary:
          type: object
          properties:
            created:
              type: integer
            failed:
              type: integer
            updated:
              type: integer
        results:
          type: array
          items:
            type: object
      additionalProperties: true

    ChecklistFileImportResult:
      type: object
      description: Single-file CKL/CKLB/xccdf-results ingest response
      properties:
        host:
          type: object
          properties:
            created:
              type: boolean
        checklists:
          type: array
          items:
            type: object
            properties:
              created:
                type: boolean
      additionalProperties: true

    CollectionTransferResult:
      type: object
      properties:
        summary:
          type: object
          properties:
            moved:
              type: integer
      additionalProperties: true

    BaselinePointer:
      type: object
      properties:
        baseline_id:
          type: string
        stig_id:
          type: string
        version:
          type: string
        title:
          type: string
        benchmark_date:
          type: string
        content_fingerprint:
          type: string

    BaselineRuleMatch:
      type: object
      properties:
        rule_key:
          type: string
        group_id:
          type: string
        rule_id:
          type: string
        rule_id_src:
          type: string
        rule_version:
          type: string
        severity:
          type: string
        rule_title:
          type: string
        group_title:
          type: string
        ccis:
          type: array
          items:
            type: string
        check_content_hash:
          type: string
        baseline:
          $ref: "#/components/schemas/BaselinePointer"

    BaselineRuleRefList:
      type: object
      properties:
        rule_ref:
          type: string
        stig_id:
          type: string
          nullable: true
        match_count:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/BaselineRuleMatch"

    BaselineCciRefList:
      type: object
      properties:
        cci:
          type: string
        stig_id:
          type: string
          nullable: true
        match_count:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/BaselineRuleMatch"

    BaselineGroupRefList:
      type: object
      properties:
        group_id:
          type: string
        stig_id:
          type: string
          nullable: true
        match_count:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/BaselineRuleMatch"

    BaselineJobActionResult:
      type: object
      properties:
        action:
          type: string
        created:
          type: boolean
        deduplicated:
          type: boolean
      additionalProperties: true
