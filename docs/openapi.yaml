openapi: 3.0.3
info:
  title: STIG in Splunk persist REST API
  version: 0.1.0
  description: |
    Splunk custom **persist** REST surface for the `stigs_in_splunk` app (KV-backed STIG workspaces,
    checklists, and reviews). Paths mirror `restmap.conf` `match` values under the Splunk namespace
    `servicesNS/nobody/stigs_in_splunk`.

    **Not** the STIG Manager OpenAPI (`stig-manager.yaml`). Resource names are Splunk-shaped (`stig_*`).

    **Versioning:** `info.version` tracks the app release (`package/app.manifest`, `globalConfig.yaml`).
    URL paths are not version-prefixed. Update this file when `package/bin/stig_rest_handler.py` changes.

    **Auth:** Splunk session or HTTP Basic on the management port; Splunk Web uses session + CSRF form key.
    No parallel OIDC or OAuth scopes in this app.

    **Errors:** Most failures return JSON `{"error": "<message>"}` with an appropriate HTTP status.
    Successful JSON bodies are returned directly (Splunk persist `output_modes=json`).

    **Capabilities:** See `package/default/authorize.conf` and per-route `capability.*` in `restmap.conf`.
    Workspace grants may return **404** instead of **403** to avoid leaking collection existence.

  contact:
    name: stigs_in_splunk
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://{host}:8089/servicesNS/nobody/stigs_in_splunk
    description: Splunk management port (curl, automation)
    variables:
      host:
        default: localhost
  - url: https://{host}/{locale}/splunkd/__raw/servicesNS/nobody/stigs_in_splunk
    description: Splunk Web proxy (browser UI)
    variables:
      host:
        default: localhost
      locale:
        default: en-US

tags:
  - name: Collections
    description: Workspaces (`stig_collections`)
  - name: Collection grants
  - name: Collection labels
  - name: Collection reporting
  - name: Hosts
    description: Assets (`stig_hosts`)
  - name: Baselines
    description: STIG library (`stig_baselines`)
  - name: Baseline jobs
  - name: Checklists
  - name: Reviews
  - name: Imports
  - name: Findings
  - name: Settings
  - name: Assignment
    description: HEC routing rules and preview
  - name: UCC baselines
    description: Configuration table adapter (`stigs_in_splunk_baseline`)

security:
  - splunkBasicAuth: []
  - splunkSessionCookie: []

paths:
  /stig_collections:
    get:
      tags: [Collections]
      summary: List workspaces
      operationId: listCollections
      responses:
        "200":
          description: Array of workspace records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
    post:
      tags: [Collections]
      summary: Create workspace
      operationId: createCollection
      x-splunk-capability: stig_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"

  /stig_collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections]
      summary: Get workspace
      operationId: getCollection
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Collections]
      summary: Update workspace
      operationId: patchCollection
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    put:
      tags: [Collections]
      summary: Update workspace (alias)
      operationId: putCollection
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    post:
      tags: [Collections]
      summary: Update workspace (alias)
      operationId: postCollection
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
    delete:
      tags: [Collections]
      summary: Delete workspace
      operationId: deleteCollection
      x-splunk-capability: stig_admin
      parameters:
        - name: cascade
          in: query
          schema:
            type: boolean
          description: When true, delete child hosts, checklists, grants, etc.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cascade:
                  type: boolean
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Children exist; pass cascade=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CascadeRequiredError"

  /stig_collections/{collectionId}/metadata:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections]
      summary: Get workspace metadata JSON
      operationId: getCollectionMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDocument"
    patch:
      tags: [Collections]
      summary: Patch workspace metadata
      operationId: patchCollectionMetadata
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataPatch"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDocument"

  /stig_collections/{collectionId}/clone:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    post:
      tags: [Collections]
      summary: Clone workspace
      operationId: cloneCollection
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCloneRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/export-to/{destCollectionId}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - name: destCollectionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Collections]
      summary: Bulk transfer hosts to another workspace
      operationId: transferHostsToCollection
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Transfer finished; no hosts moved (`summary.moved` is 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionTransferResult"
        "201":
          description: At least one host moved to the destination workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionTransferResult"

  /stig_collections/{collectionId}/baseline_defaults:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections]
      summary: List default baseline per STIG id
      operationId: listBaselineDefaults
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [Collections]
      summary: Set default baseline for a STIG id
      operationId: setBaselineDefault
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [baseline_id]
              properties:
                stig_id:
                  type: string
                benchmark_id:
                  type: string
                  description: Alias for stig_id
                baseline_id:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/baseline_defaults/{stigId}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - name: stigId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Collections]
      summary: Remove default baseline for a STIG id
      operationId: deleteBaselineDefault
      x-splunk-capability: stig_write
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/review_requirements:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections]
      summary: Get review validation policy
      operationId: getReviewRequirements
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [Collections]
      summary: Update review validation policy
      operationId: patchReviewRequirements
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/review_aging:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections]
      summary: Get review aging policy
      operationId: getReviewAging
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [Collections]
      summary: Update review aging policy
      operationId: patchReviewAging
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/review_aging/stale:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections, Reviews]
      summary: List stale reviews for a workspace
      operationId: listStaleReviews
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/review-history:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collections, Reviews]
      summary: List review change history for a workspace
      operationId: listCollectionReviewHistory
      parameters:
        - name: host_id
          in: query
          schema:
            type: string
        - name: baseline_id
          in: query
          schema:
            type: string
        - name: rule_id
          in: query
          schema:
            type: string
        - name: review_id
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: number
          description: Minimum `created_at` epoch (alias `created_after`)
        - name: until
          in: query
          schema:
            type: number
          description: Maximum `created_at` epoch (alias `created_before`)
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewHistoryListResponse"
        "404":
          description: Unknown workspace or no read access

  /stig_collections/{collectionId}/upgrade_checklists:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    post:
      tags: [Collections]
      summary: Bulk upgrade checklists to a newer baseline revision
      operationId: upgradeCollectionChecklists
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                baseline_id:
                  type: string
                from_baseline_id:
                  type: string
                stig_id:
                  type: string
                benchmark_id:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/metrics:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection reporting]
      summary: Workspace dashboard metrics
      operationId: getCollectionMetrics
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/findings:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection reporting]
      summary: Paginated governance-open findings
      operationId: getCollectionFindings
      parameters:
        - $ref: "#/components/parameters/paginationOffset"
        - $ref: "#/components/parameters/paginationLimit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/findings/aggregate:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection reporting]
      summary: Aggregate open findings by group, rule, or CCI
      operationId: aggregateCollectionFindings
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            example: group_id,rule_id,cci
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/unreviewed/rules:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection reporting]
      summary: Unreviewed rule counts
      operationId: getUnreviewedRules
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/unreviewed/assets:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection reporting]
      summary: Unreviewed counts per host
      operationId: getUnreviewedAssets
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/poam:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection reporting]
      summary: POA&M export
      operationId: getCollectionPoam
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, xlsx]
            default: json
      responses:
        "200":
          description: JSON object, or CSV/XLSX attachment when format is csv/xlsx
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string

  /stig_collections/{collectionId}/imports:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    post:
      tags: [Imports]
      summary: Collection import builder (batch files or checklist zip)
      operationId: importToCollection
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionImportBatch"
          application/octet-stream:
            schema:
              type: string
              format: binary
            description: Zip body with format=zip (query or JSON hint)
      responses:
        "200":
          description: |
            Batch or zip import finished without new host/checklist rows, with partial
            per-file failures (`summary.failed` > 0), or idempotent updates only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchResult"
        "201":
          description: At least one imported file created a new host or checklist (`summary.created` > 0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchResult"

  /stig_collections/{collectionId}/archive/{format}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - name: format
        in: path
        required: true
        schema:
          type: string
          enum: [ckl, cklb]
    post:
      tags: [Checklists]
      summary: Export workspace checklists as zip archive
      operationId: exportCollectionArchive
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host_id:
                  type: string
                baseline_id:
                  type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/grants:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection grants]
      summary: List grants
      operationId: listGrants
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [Collection grants]
      summary: Create grant
      operationId: createGrant
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - $ref: "#/components/parameters/grantId"
    get:
      tags: [Collection grants]
      summary: Get grant
      operationId: getGrant
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [Collection grants]
      summary: Update grant
      operationId: patchGrant
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Collection grants]
      summary: Delete grant
      operationId: deleteGrant
      x-splunk-capability: stig_write
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/grants/{grantId}/acl:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - $ref: "#/components/parameters/grantId"
    put:
      tags: [Collection grants]
      summary: Set restricted grant ACL filters
      operationId: putGrantAcl
      x-splunk-capability: stig_write
      requestBody:
        $ref: "#/components/requestBodies/GrantAclBody"
      responses:
        "200":
          description: Updated grant ACL
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [Collection grants]
      summary: Set restricted grant ACL filters (alias)
      operationId: patchGrantAcl
      x-splunk-capability: stig_write
      requestBody:
        $ref: "#/components/requestBodies/GrantAclBody"
      responses:
        "200":
          description: Updated grant ACL
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [Collection grants]
      summary: Set restricted grant ACL filters (alias)
      operationId: postGrantAcl
      x-splunk-capability: stig_write
      requestBody:
        $ref: "#/components/requestBodies/GrantAclBody"
      responses:
        "200":
          description: Updated grant ACL
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/labels:
    parameters:
      - $ref: "#/components/parameters/collectionId"
    get:
      tags: [Collection labels]
      summary: List labels
      operationId: listLabels
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [Collection labels]
      summary: Create label
      operationId: createLabel
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - name: labelId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Collection labels]
      summary: Get label
      operationId: getLabel
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [Collection labels]
      summary: Update label
      operationId: patchLabel
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Collection labels]
      summary: Delete label
      operationId: deleteLabel
      x-splunk-capability: stig_write
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_collections/{collectionId}/labels/{labelId}/assets:
    parameters:
      - $ref: "#/components/parameters/collectionId"
      - name: labelId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Collection labels]
      summary: Assign label to hosts
      operationId: assignLabelToHosts
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                host_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object

  /stig_findings:
    get:
      tags: [Findings]
      summary: Workspace findings (alias of collection findings)
      operationId: listFindings
      parameters:
        - name: stig_collection_id
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/paginationOffset"
        - $ref: "#/components/parameters/paginationLimit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"

  /stig_hosts:
    get:
      tags: [Hosts]
      summary: List hosts
      operationId: listHosts
      parameters:
        - name: stig_collection_id
          in: query
          schema:
            type: string
        - name: label_id
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Host"
    post:
      tags: [Hosts]
      summary: Create host
      operationId: createHost
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"

  /stig_hosts/{hostId}:
    parameters:
      - $ref: "#/components/parameters/hostId"
    get:
      tags: [Hosts]
      summary: Get host
      operationId: getHost
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
    patch:
      tags: [Hosts]
      summary: Update host (including move workspace via stig_collection_id)
      operationId: patchHost
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostUpdate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
    delete:
      tags: [Hosts]
      summary: Delete host
      operationId: deleteHost
      x-splunk-capability: stig_admin
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string

  /stig_hosts/{hostId}/metadata:
    parameters:
      - $ref: "#/components/parameters/hostId"
    get:
      tags: [Hosts]
      summary: Get host metadata JSON
      operationId: getHostMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataDocument"
    patch:
      tags: [Hosts]
      summary: Patch host metadata
      operationId: patchHostMetadata
      x-splunk-capability: stig_write
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataPatch"
      responses:
        "200":
          content:
            application/json:
              schema:
